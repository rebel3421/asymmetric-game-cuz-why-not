<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>3D Horror</title><style>
body{margin:0;background:#000;color:#fff;

</style></head><body>
<div id="menu"><h2>Faction</h2>
<p style="font-size:12px;color:#aaa;">

<div id="fx-box"></div>
<div id="puz"><h3>REPAIR GENERATOR</h3>

<div id="sc-box"><div id="sc-zone"></div>
<div id="sc-hand"></div></div>
<p id="puz-stat" style="color:#aaa;">Progress: 0%</p></div>
<canvas id="c"></canvas><script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let rRole="",run=false,keys={},click=false;
let p={x:0,y:0,s:100,sp:160,st:100,a:true,
yaw:0,pitch:0.45};
let bots=[],pil=[],gens=[],timer=180,lt=0;
let repairing=null,scAngle=0,scZoneStart=0;
let scActive=false,scSuccess=45;
const MV=450;
window.onresize=()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;};
window.onresize();

keys[e.key]=true;

if(rRole==="Killer"){
if(k==="q"&&p.cdDecap<=0)useDecapitate();

if(k==="r"&&p.cdRage<=0)useRagingPace();}};
window.onkeyup=(e)=>keys[e.key]=false;

document.addEventListener('mousemove',(e)=>{
if(document.pointerLockElement===canvas&&!repairing){
p.yaw-=(e.movementX*0.003);
p.pitch=Math.max(0.2,Math.min(0.7,
p.pitch-(e.movementY*0.002)));}});
function start(role){
rRole=role;
document.getElementById("menu").style.display="none";
document.getElementById("ui").style.display="block";
p={x:0,y:0,s:role==="Killer"?135:100,sp:160,
st:100,hp:100,a:true,cdSlash:0,cdDecap:0,
cdGash:0,cdRage:0,rageTimer:0,yaw:0,
pitch:0.45,fx:{}};
bots=[];pil=[];gens=[];repairing=null;

let cnt=role==="Survivor"?4:5;
for(let i=0;i<cnt;i++){
bots.push({t:"Survivor",x:(Math.random()-0.5)*500,
y:(Math.random()-0.5)*500,s:100,hp:100,
a:true,fx:{}});}
if(role==="Survivor"){
bots.push({t:"Killer",x:200,y:200,s:125,
cdSlash:0,cdDecap:0,cdGash:0,cdRage:0,
rageTimer:0,st:100,hp:999,fx:{}});}

y:(Math.random()-0.5)*600,r:15});}

{x:150,y:-150,prog:0,done:false},
{x:0,y:200,prog:0,done:false});

lt=performance.now();
requestAnimationFrame(loop);}
function proj(wx,wy,wh=0){
let camDist=120,camH=80;
let cx=p.x-Math.sin(p.yaw)*camDist;
let cy=p.y-Math.cos(p.yaw)*camDist;
let cz=camH;
let dx=wx-cx,dy=wy-cy,dh=wh-cz;
let rx=dx*Math.cos(p.yaw)+dy*Math.sin(p.yaw);
let ry=-dx*Math.sin(p.yaw)+dy*Math.cos(p.yaw);
let rz=dh;
let rY=ry*Math.cos(p.pitch)-rz*Math.sin(p.pitch);
let rZ=ry*Math.sin(p.pitch)+rz*Math.cos(p.pitch);
if(rY<=5)return null;let s=500/rY;
return{x:(canvas.width/2)+(rx*s),
y:(canvas.height/2)-(rZ*s),z:s,d:rY};}
function loop(t){if(!run)return;
let dt=(t-lt)/1000;lt=t;update(dt);draw();
requestAnimationFrame(loop);}
function triggerSkillCheck(){
scAngle=0;scZoneStart=Math.random()*260;
document.getElementById("sc-zone")
.style.transform="rotate("+scZoneStart+"deg)";

function checkSkillCheck(){
if(p.fx.Helpless)return;

let start=scZoneStart,end=scZoneStart+scSuccess;
if(nAngle>=start&&nAngle<=end){

"Progress: "+repairing.prog+"%";
if(repairing.prog>=100){
repairing.done=true;exitRepair();
}else{triggerSkillCheck();}}else{
repairing.prog=Math.max(0,repairing.prog-15);

"Progress: "+repairing.prog+"% (STRIKE!)";
triggerSkillCheck();}}
function exitRepair(){repairing=null;
scActive=false;document.getElementById("puz")
.style.display="none";canvas.requestPointerLock();}
function applyHelpless(target,dur){
target.fx.Helpless=dur;
if(target===p){exitRepair();}}
function launchBoost(){if(p.rageTimer>0){
p.x+=Math.sin(p.yaw)*45;p.y+=Math.cos(p.yaw)*45;}}
function useSlash(){
p.cdSlash=0.5;launchBoost();
bots.forEach(b=>{if(b.t==="Survivor"&&b.a&&
Math.hypot(b.x-p.x,b.y-p.y)<45){
b.hp-=20;if(b.hp<=0)b.a=false;}});}
function useDecapitate(){
let isRage=(p.rageTimer>0);
p.cdDecap=isRage?10:15;let dmg=isRage?35:25;
launchBoost();bots.forEach(b=>{
if(b.t==="Survivor"&&b.a&&
Math.hypot(b.x-p.x,b.y-p.y)<45){
b.hp-=dmg;applyHelpless(b,6.0);
if(b.hp<=0)b.a=false;}});}
function useGashingWound(){
p.cdGash=30;let dmg=(p.rageTimer>0)?70:50;
bots.forEach(b=>{if(b.t==="Survivor"&&b.a&&
Math.hypot(b.x-p.x,b.y-p.y)<45){
dmg;if(b.hp<=0)b.a=false;}});}
function useRagingPace(){
p.cdRage=15;p.rageTimer=30;p.st=100;}
function update(dt){
timer-=dt;if(timer<=0)return end("TIME EXPIRED!");
if(scActive){scAngle=(scAngle+180*dt);
document.getElementById("sc-hand")
.style.transform="rotate("+scAngle+"deg)";
if(scAngle>360){triggerSkillCheck();}}
if(p.fx.Helpless){p.fx.Helpless-=dt;
if(p.fx.Helpless<=0)delete p.fx.Helpless;}
if(p.rageTimer>0){p.rageTimer-=dt;
if(p.st>70)p.st=Math.max(70,p.st-10*dt);
else p.st=Math.min(70,p.st+15*dt);}
bots.forEach(b=>{if(b.fx.Helpless){
b.fx.Helpless-=dt;
if(b.fx.Helpless<=0)delete b.fx.Helpless;}});
if(repairing){if(keys.Escape||
Math.hypot(repairing.x-p.x,repairing.y-p.y)>50||
p.fx.Helpless){exitRepair();}}
if(p.cdSlash>0)p.cdSlash-=dt;
if(p.cdDecap>0)p.cdDecap-=dt;
if(p.cdGash>0)p.cdGash-=dt;
if(p.cdRage>0)p.cdRage-=dt;
if(p.a&&!repairing){
if(keys.ArrowLeft)p.yaw+=2.5*dt;
if(keys.ArrowRight)p.yaw-=2.5*dt;
let mv=keys.ArrowUp||keys.ArrowDown;
let ox=p.x,oy=p.y,sp=p.s;
if(p.rageTimer>0){sp=90;}else{
if(rRole==="Survivor"&&keys.Shift&&
p.st>0&&mv&&!p.fx.Helpless){
sp=p.sp;p.st=Math.max(0,p.st-35*dt);
}else{p.st=Math.min(100,p.st+15*dt);}}
if(!mv&&p.rageTimer<=0)p.st=Math.min(100,
p.st+20*dt);
let fx=Math.sin(p.yaw),fy=Math.cos(p.yaw);
if(keys.ArrowUp){p.x+=fx*sp*dt;p.y+=fy*sp*dt;}
if(keys.ArrowDown){p.x-=fx*sp*dt;p.y-=fy*sp*dt;}
if(Math.abs(p.x)>400)p.x=ox;
if(Math.abs(p.y)>400)p.y=oy;
if(rRole==="Survivor"&&keys.Control&&
!p.fx.Helpless){gens.forEach(g=>{
if(!g.done&&Math.hypot(g.x-p.x,g.y-p.y)<45){
repairing=g;document.exitPointerLock();
document.getElementById("puz")
.style.display="block";triggerSkillCheck();}});}}
let kil=rRole==="Killer"?p:
bots.find(b=>b.t==="Killer"),svC=0;
bots.forEach(b=>{if(b.t==="Survivor"){
if(!b.a)return;svC++;
let d=Math.hypot(kil.x-b.x,kil.y-b.y);
if(d<180){b.x-=(kil.x-b.x)/d*b.s*dt;
b.y-=(kil.y-b.y)/d*b.s*dt;}else{
b.x+=Math.sin(performance.now()/500)*5*dt;}}
else if(b.t==="Killer"&&kil!==p){
if(b.cdSlash>0)b.cdSlash-=dt;
if(b.cdDecap>0)b.cdDecap-=dt;
if(b.rageTimer>0){b.rageTimer-=dt;b.st=70;
}else{if(Math.random()<0.005&&b.cdRage<=0){
b.cdRage=15;b.rageTimer=30;}}
let cl=null,mD=Infinity;
if(rRole==="Survivor"&&p.a){
mD=Math.hypot(p.x-b.x,p.y-b.y);cl=p;}
bots.forEach(s=>{if(s.t==="Survivor"&&s.a){
let d=Math.hypot(s.x-b.x,s.y-b.y);
if(d<mD){mD=d;cl=s;}}});if(cl){
b.x+=(cl.x-b.x)/mD*((b.rageTimer>0?90:b.s))*dt;
b.y+=(cl.y-b.y)/mD*((b.rageTimer>0?90:b.s))*dt;
if(mD<45&&b.cdSlash<=0){b.cdSlash=0.5;
if(b.rageTimer>0){
b.x+=Math.sin(Math.atan2(cl.x-b.x,cl.y-b.y))*45;
b.y+=Math.cos(Math.atan2(cl.x-b.x,cl.y-b.y))*45;}
if(cl===p&&p.rageTimer>0){}else{
cl.hp-=(b.rageTimer>0?35:20);
if(Math.random()<0.3&&b.cdDecap<=0){
b.cdDecap=10;applyHelpless(cl,6.0);}
if(cl.hp<=0){cl.a=false;if(cl===p){
exitRepair();end("YOU DIED!");}}}}}}});
let gLeft=gens.filter(g=>!g.done).length;
document.getElementById("genUI").innerText=
"Gens Left: "+gLeft;
let total=svC+(rRole==="Survivor"&&p.a?1:0);
document.getElementById("sv").innerText=
"Survivors: "+total+" | Time: "+Math.ceil(timer);
document.getElementById("st").innerText=
rRole==="Survivor"?
"Stamina: "+Math.floor(p.st)+"% | HP: "+p.hp:
"Stamina: "+Math.floor(p.st)+
"% | HP: INVINCIBLE";
let fxBox=document.getElementById("fx-box");
fxBox.innerHTML="";
if(p.fx.Helpless)fxBox.innerHTML+=
'<div class="fx-tag">HELPLESS ('+
Math.ceil(p.fx.Helpless)+'s)</div>';
if(p.rageTimer>0)fxBox.innerHTML+=
'<div class="fx-tag rage-tag">ENRAGED ('+
Math.ceil(p.rageTimer)+'s)</div>';
if(rRole==="Killer"){document.getElementById("abilUI").innerHTML="[LMB] Slash: "+(p.cdSlash>0?p.cdSlash.toFixed(1)+"s":"READY")+" | [Q] Decapitate: "+(p.cdDecap>0?p.cdDecap.toFixed(1)+"s":"READY")+""+"[E] Gashing Wound: "+(p.cdGash>0?p.cdGash.toFixed(1)+"s":"READY")+" | [R] Raging Pace: "+(p.cdRage>0?p.cdRage.toFixed(1)+"s":"READY");}else{document.getElementById("abilUI").innerText="";}if(gLeft===0)end("SURVIVORS ESCAPED!");if(total===0)end(rRole==="Killer"?"KILLER WINS!":"SURVIVORS DIED!");}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=-400;i<=400;i+=40){for(let j=-400;j<=400;j+=40){let d=Math.hypot(i-p.x,j-p.y);if(d>MV)continue;let pt=proj(i,j,0);if(pt){ctx.fillStyle="rgba(80,80,90,"+(1-(d/MV))0.4+")";ctx.fillRect(pt.x,pt.y,2,2);}}}let lst=[];bots.forEach(b=>{if(b.t==="Survivor"&&!b.a)return;let d=Math.hypot(b.x-p.x,b.y-p.y);if(d>MV)return;let pr1=proj(b.x,b.y,0),pr2=proj(b.x,b.y,30);if(pr1&&pr2)lst.push({p1:pr1,p2:pr2,c:b.t==="Killer"?(b.rageTimer>0?"255,140,0":"255,50,50"):"80,240,80",t:b.t+(b.fx.Helpless?" [HELPLESS]":"")+(b.t==="Killer"&&b.rageTimer>0?" [ENRAGED]":"")+" (HP:"+b.hp+")",d:pr1.d,ty:"b"});});pil.forEach(pl=>{let dP=Math.hypot(pl.x-p.x,pl.y-p.y);if(dP>MV)return;let pr1=proj(pl.x,pl.y,0),pr2=proj(pl.x,pl.y,60);if(pr1&&pr2)lst.push({p1:pr1,p2:pr2,c:"20,20,25",t:"",d:pr1.d,ty:"p",w:pl.r});});gens.forEach(g=>{let dP=Math.hypot(g.x-p.x,g.y-p.y);if(dP>MV)return;let pr1=proj(g.x,g.y,0),pr2=proj(g.x,g.y,45);if(pr1&&pr2)lst.push({p1:pr1,p2:g.done?proj(g.x,g.y,25):pr2,c:g.done?"50,255,50":"230,130,20",t:g.done?"GEN [DONE]":"GEN [Ctrl]",d:pr1.d,ty:"g",w:20});});let sP1=proj(p.x,p.y,0),sP2=proj(p.x,p.y,30);if(sP1&&sP2){let hX=sP1.x+Math.sin(p.yaw)15sP1.z;let hY=sP2.y;lst.push({p1:sP1,p2:sP2,hx:hX,hy:hY,c:rRole==="Killer"?(p.rageTimer>0?"255,150,0":"255,100,100"):"100,200,255",t:"YOU"+(p.fx.Helpless?" [HELPLESS]":"")+(p.rageTimer>0?" [ENRAGED]":""),d:sP1.d,ty:"player"});}if(rRole==="Survivor"||p.rageTimer>0){let k=rRole==="Killer"?p:bots.find(b=>b.t==="Killer");if(k){let d=Math.hypot(k.x-p.x,k.y-p.y);if(d<180||p.rageTimer>0){ctx.fillStyle=p.rageTimer>0?"rgba(255,100,0,0.06)":"rgba(255,0,0,"+(1-(d/180))0.15+")";ctx.fillRect(0,0,canvas.width,canvas.height);}}}lst.sort((a,b)=>b.d-a.d);lst.forEach(e=>{let f=Math.max(0,1-(e.d/MV)),h=Math.abs(e.p1.y-e.p2.y),w=(e.ty==="p"||e.ty==="g")?(e.we.p1.z):h/2;if(e.ty==="player"){ctx.fillStyle="rgba("+e.c+","+f+")";ctx.fillRect(e.p2.x-w/2,e.p2.y,w,h);ctx.fillStyle="rgba(255,255,0,"+f+")";ctx.beginPath();ctx.arc(e.hx,e.hy+h0.3,w0.3,0,Math.PI2);ctx.fill();ctx.fillStyle="rgba(255,255,255,"+f+")";ctx.font=Math.max(10,e.p1.z10)+"px sans-serif";ctx.textAlign="center";ctx.fillText(e.t,e.p2.x,e.p2.y-5);}else{ctx.fillStyle="rgba("+e.c+","+f+")";ctx.fillRect(e.p2.x-w/2,e.p2.y,w,h);if(e.ty==="b"||e.ty==="g"){ctx.fillStyle="rgba(255,255,255,"+f+")";ctx.font=Math.max(10,e.p1.z10)+"px sans-serif";ctx.textAlign="center";ctx.fillText(e.t,e.p2.x,e.p2.y-5);}if(e.ty==="p"){ctx.strokeStyle="rgba(70,70,80,"+(f0.5)+")";ctx.lineWidth=Math.max(1,e.p1.z0.5);ctx.strokeRect(e.p2.x-w/2,e.p2.y,w,h);}}});}function end(m){run=false;document.exitPointerLock();alert(m);document.getElementById("menu").style.display="block";document.getElementById("ui").style.display="none";document.getElementById("puz").style.display="none";}
