<!DOCTYPE html><html><head><meta charset="UTF-8"><title>3D Horror</title><style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;}
canvas{display:block;width:100vw;height:100vh;cursor:pointer;}
#ui{position:absolute;top:10px;left:10px;text-shadow:1px 1px 2px #000;pointer-events:none;font-size:14px;}
#menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;padding:20px;border:2px solid #333;text-align:center;z-index:10;}
button{background:#800;color:#fff;border:none;padding:10px 20px;margin:5px;cursor:pointer;font-weight:bold;}
#puz{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);border:2px solid #555;padding:20px;text-align:center;display:none;z-index:5;}
#sc-box{position:relative;width:160px;height:160px;border-radius:50%;border:4px solid #333;margin:15px auto;}
#sc-zone{position:absolute;width:160px;height:160px;border-radius:50%;border:4px solid transparent;border-top-color:#0f0;transform:rotate(45deg);top:-4px;left:-4px;}
#sc-hand{position:absolute;width:2px;height:80px;background:#ff0;left:79px;top:0;transform-origin:bottom center;}
#fx-box{position:absolute;top:10px;right:10px;pointer-events:none;z-index:5;}
.fx-tag{background:rgba(136,0,0,0.85);border:1px solid #f00;color:#fff;padding:6px 12px;font-size:12px;font-weight:bold;margin-bottom:5px;text-shadow:1px 1px 1px #000;}
.rage-tag{background:rgba(230,90,0,0.85);border:1px solid #ffaa00;}
</style></head><body>
<div id="menu"><h2>3D Horror Arena</h2><p style="font-size:12px;color:#aaa;">Click start to roll a random 50/50 role assignment.<br>Use ARROW KEYS to move & steer.</p>
<button onclick="rollRoleAndStart()">START GAME</button></div>
<div id="ui" style="display:none;"><div id="r"></div><div id="st"></div><div id="sv"></div><div id="genUI">Gens Left: 3</div><div id="abilUI" style="margin-top:5px;color:#ff3333;font-weight:bold;font-size:12px;"></div></div>
<div id="fx-box"></div>
<div id="puz"><h3>REPAIR GENERATOR</h3><p>Press <b>SPACEBAR</b> when the yellow hand hits the <b>GREEN ZONE</b>!</p><div id="sc-box"><div id="sc-zone"></div><div id="sc-hand"></div></div><p id="puz-stat" style="color:#aaa;">Progress: 0%</p></div>
<canvas id="c"></canvas><script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let rRole="",run=false,keys={},click=false,p={x:0,y:0,s:100,sp:160,st:100,a:true,yaw:0,pitch:0.45},bots=[],pil=[],gens=[],timer=180,lt=0;
let repairing=null,scAngle=0,scZoneStart=0,scActive=false,scSuccess=45;
const MV=450;window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;};window.onresize();
window.onkeydown=(e)=>{keys[e.key]=true;if(e.key===" "&&scActive)checkSkillCheck();let k=e.key.toLowerCase();if(rRole==="Killer"){if(k==="q"&&p.cdDecap<=0)useDecapitate();if(k==="e"&&p.cdGash<=0)useGashingWound();if(k==="r"&&p.cdRage<=0)useRagingPace();}};window.onkeyup=(e)=>keys[e.key]=false;
canvas.onclick=()=>{if(run){if(!repairing)canvas.requestPointerLock();if(rRole==="Killer"&&p.cdSlash<=0)useSlash();}};
document.addEventListener('mousemove',(e)=>{if(document.pointerLockElement===canvas&&!repairing){
p.yaw-=(e.movementX*0.003);p.pitch=Math.max(0.2,Math.min(0.7,p.pitch-(e.movementY*0.002)));}});
function rollRoleAndStart(){let rolledRole=Math.random()<0.5?"Survivor":"Killer";start(rolledRole);}
function start(role){
rRole=role;document.getElementById("menu").style.display="none";document.getElementById("ui").style.display="block";
p={x:0,y:0,s:role==="Killer"?135:100,sp:160,st:100,hp:100,a:true,cdSlash:0,cdDecap:0,cdGash:0,cdRage:0,rageTimer:0,yaw:0,pitch:0.45,fx:{}};bots=[],pil=[],gens=[],repairing=null,scActive=false;let cnt=role==="Survivor"?4:5;
for(let i=0;i<cnt;i++)bots.push({t:"Survivor",x:(Math.random()-0.5)*500,y:(Math.random()-0.5)*500,s:100,hp:100,a:true,fx:{}});
if(role==="Survivor")bots.push({t:"Killer",x:200,y:200,s:125,cdSlash:0,cdDecap:0,cdGash:0,cdRage:0,rageTimer:0,st:100,hp:999,fx:{}});
for(let i=0;i<10;i++)pil.push({x:(Math.random()-0.5)*600,y:(Math.random()-0.5)*600,r:15});
gens.push({x:-150,y:-150,prog:0,done:false},{x:150,y:-150,prog:0,done:false},{x:0,y:200,prog:0,done:false});
canvas.requestPointerLock();run=true;lt=performance.now();requestAnimationFrame(loop);
}
function proj(wx,wy,wh=0){
let camDist=120,camH=80;let cx=p.x-Math.sin(p.yaw)*camDist,cy=p.y-Math.cos(p.yaw)*camDist,cz=camH;let dx=wx-cx,dy=wy-cy,dh=wh-cz;
let rx=dx*Math.cos(p.yaw)+dy*Math.sin(p.yaw),ry=-dx*Math.sin(p.yaw)+dy*Math.cos(p.yaw),rz=dh;let rY=ry*Math.cos(p.pitch)-rz*Math.sin(p.pitch),rZ=ry*Math.sin(p.pitch)+rz*Math.cos(p.pitch);
if(rY<=5)return null;let s=500/rY;return{x:(canvas.width/2)+(rx*s),y:(canvas.height/2)-(rZ*s),z:s,d:rY};
}
function loop(t){if(!run)return;let dt=(t-lt)/1000;lt=t;update(dt);draw();requestAnimationFrame(loop);}
function triggerSkillCheck(){scAngle=0;scZoneStart=Math.random()*260;document.getElementById("sc-zone").style.transform="rotate("+scZoneStart+"deg)";scActive=true;}
function checkSkillCheck(){
if(p.fx.Helpless)return;let normalizedAngle=(scAngle%360),start=scZoneStart,end=scZoneStart+scSuccess;
if(normalizedAngle>=start&&normalizedAngle<=end){repairing.prog=Math.min(100,repairing.prog+25);document.getElementById("puz-stat").innerText="Progress: "+repairing.prog+"%";if(repairing.prog>=100){repairing.done=true;exitRepair();}else{triggerSkillCheck();}
}else{repairing.prog=Math.max(0,repairing.prog-15);document.getElementById("puz-stat").innerText="Progress: "+repairing.prog+"% (TRIGGERED STRIKE!)";triggerSkillCheck();}
}
function exitRepair(){repairing=null;scActive=false;document.getElementById("puz").style.display="none";canvas.requestPointerLock();}
function applyHelpless(target,dur){target.fx.Helpless=dur;if(target===p){exitRepair();}}
function launchBoost(){if(p.rageTimer>0){p.x+=Math.sin(p.yaw)*45;p.y+=Math.cos(p.yaw)*45;}}
function useSlash(){p.cdSlash=0.5;launchBoost();bots.forEach(b=>{if(b.t==="Survivor"&&b.a&&Math.hypot(b.x-p.x,b.y-p.y)<45){b.hp-=20;if(b.hp<=0)b.a=false;}});}
function useDecapitate(){let isRage=(p.rageTimer>0);p.cdDecap=isRage?10:15;let dmg=isRage?35:25;launchBoost();bots.forEach(b=>{if(b.t==="Survivor"&&b.a&&Math.hypot(b.x-p.x,b.y-p.y)<45){b.hp-=dmg;applyHelpless(b,6.0);if(b.hp<=0)b.a=false;}});}
function useGashingWound(){p.cdGash=30;let dmg=(p.rageTimer>0)?70:50;bots.forEach(b=>{if(b.t==="Survivor"&&b.a&&Math.hypot(b.x-p.x,b.y-p.y)<45){b.hp-=dmg;if(b.hp<=0)b.a=false;}});}
function useRagingPace(){p.cdRage=15;p.rageTimer=30;p.st=100;}
function update(dt){
timer-=dt;if(timer<=0)return end("TIME EXPIRED!");
if(scActive){scAngle=(scAngle+180*dt);document.getElementById("sc-hand").style.transform="rotate("+scAngle+"deg)";if(scAngle>360){triggerSkillCheck();}}
if(p.fx.Helpless){p.fx.Helpless-=dt;if(p.fx.Helpless<=0)delete p.fx.Helpless;}
if(p.rageTimer>0){p.rageTimer-=dt;if(p.st>70)p.st=Math.max(70,p.st-10*dt);else p.st=Math.min(70,p.st+15*dt);}
bots.forEach(b=>{if(b.fx.Helpless){b.fx.Helpless-=dt;if(b.fx.Helpless<=0)delete b.fx.Helpless;}});
if(repairing){if(keys.Escape||Math.hypot(repairing.x-p.x,repairing.y-p.y)>50||p.fx.Helpless){exitRepair();}}
if(p.cdSlash>0)p.cdSlash-=dt;if(p.cdDecap>0)p.cdDecap-=dt;if(p.cdGash>0)p.cdGash-=dt;if(p.cdRage>0)p.cdRage-=dt;
if(p.a&&!repairing){
if(keys.ArrowLeft)p.yaw+=2.5*dt;if(keys.ArrowRight)p.yaw-=2.5*dt;
let mv=keys.ArrowUp||keys.ArrowDown,ox=p.x,oy=p.y,sp=p.s;
if(p.rageTimer>0){sp=90;}else{if(rRole==="Survivor"&&keys.Shift&&p.st>0&&mv&&!p.fx.Helpless){sp=p.sp;p.st=Math.max(0,p.st-35*dt);}else{p.st=Math.min(100,p.st+15*dt);}}
if(!mv&&p.rageTimer<=0)p.st=Math.min(100,p.st+20*dt);
let fx=Math.sin(p.yaw),fy=Math.cos(p.yaw);if(keys.ArrowUp){p.x+=fx*sp*dt;p.y+=fy*sp*dt;}if(keys.ArrowDown){p.x-=fx*sp*dt;p.y-=fy*sp*dt;}
if(Math.abs(p.x)>400)p.x=ox;if(Math.abs(p.y)>400)p.y=oy;
if(rRole==="Survivor"&&keys.Control&&!p.fx.Helpless){gens.forEach(g=>{if(!g.done&&Math.hypot(g.x-p.x,g.y-p.y)<45){repairing=g;document.exitPointerLock();document.getElementById("puz").style.display="block";triggerSkillCheck();}});}
}
let kil=rRole==="Killer"?p:bots.find(b=>b.t==="Killer"),svC=0;
bots.forEach(b=>{
if(b.t==="Survivor"){if(!b.a)return;svC++;let d=Math.hypot(kil.x-b.x,kil.y-b.y);
if(d<180){let a=Math.atan2(b.y-kil.y,b.x-kil.x);b.x+=Math.cos(a)*b.s*1.2*dt;b.y+=Math.sin(a)*b.s*1.2*dt;}
else{let g=gens.find(x=>!x.done);if(g){let a=Math.atan2(g.y-b.y,g.x-b.x);b.x+=Math.cos(a)*b.s*0.6*dt;b.y+=Math.sin(a)*b.s*0.6*dt;if(Math.hypot(g.x-b.x,g.y-b.y)<15)g.prog=Math.min(100,g.prog+4*dt);if(g.prog>=100)g.done=true;}}}
else if(b.t==="Killer"){let t=bots.filter(x=>x.t==="Survivor"&&x.a).sort((m,n)=>Math.hypot(m.x-p.x,m.y-p.y)-Math.hypot(n.x-p.x,n.y-p.y));if(!t)t=p;
let a=Math.atan2(t.y-b.y,t.x-b.x);b.x+=Math.cos(a)*b.s*dt;b.y+=Math.sin(a)*b.s*dt;if(Math.hypot(t.x-b.x,t.y-b.y)<40&&Math.random()<0.05){t.hp-=15;if(t.hp<=0)t.a=false;}}
});
if(rRole==="Killer"&&svC===0)end("KILLER WINS!");
let left=gens.filter(g=>!g.done).length;document.getElementById("genUI").innerText="Gens Left: "+left;
if(left===0)end("SURVIVORS ESCAPED!");
if(rRole==="Survivor"&&!p.a)end("YOU DIED!");
}
function draw(){
ctx.fillStyle="#05050a";ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#111118";ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,400,0,Math.PI*2);ctx.fill();
let q=[];
gens.forEach(g=>{let s=proj(g.x,g.y,0);if(s){q.push({z:s.d,render:()=>{
ctx.fillStyle=g.done?"#0f0":"#555";ctx.fillRect(s.x-s.z*10,s.y-s.z*20,s.z*20,s.z*20);
ctx.fillStyle="#fff";ctx.font=(s.z*4)+"px sans-serif";ctx.fillText(Math.floor(g.prog)+"%",s.x-s.z*5,s.y-s.z*22);
}});}});
pil.forEach(p=>{let s=proj(p.x,p.y,0);if(s){q.push({z:s.d,render:()=>{ctx.fillStyle="#333";ctx.beginPath();ctx.arc(s.x,s.y,s.z*p.r,0,Math.PI*2);ctx.fill();}});}});
bots.forEach(b=>{if(!b.a)return;let s=proj(b.x,b.y,0);if(s){q.push({z:s.d,render:()=>{
ctx.fillStyle=b.t==="Killer"?"#f00":"#0af";ctx.beginPath();ctx.arc(s.x,s.y,s.z*12,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#fff";ctx.font=(s.z4)+"px sans-serif";ctx.fillText(b.t,s.x-s.z10,s.y-s.z*16);}});}});q.sort((a,b)=>b.z-a.z).forEach(i=>i.render());document.getElementById("r").innerText="Role: "+rRole;document.getElementById("st").innerText="Stamina: "+Math.floor(p.st)+"%";document.getElementById("sv").innerText="HP: "+(rRole==="Survivor"?p.hp:"N/A");let fxB=document.getElementById("fx-box");fxB.innerHTML="";if(p.fx.Helpless)fxB.innerHTML+='HELPLESS ('+p.fx.Helpless.toFixed(1)+'s)';if(p.rageTimer>0)fxB.innerHTML+='BLOOD RAGE ('+p.rageTimer.toFixed(1)+'s)';if(rRole==="Killer"){let abUI=document.getElementById("abilUI");abUI.innerHTML="[L-Click] Slash "+(p.cdSlash>0?"("+p.cdSlash.toFixed(1)+"s)":"[READY]")+""+"[Q] Decapitate "+(p.cdDecap>0?"("+p.cdDecap.toFixed(1)+"s)":"[READY]")+""+"[E] Gashing Wound "+(p.cdGash>0?"("+p.cdGash.toFixed(1)+"s)":"[READY]")+""+"[R] Blood Rage "+(p.cdRage>0?"("+p.cdRage.toFixed(1)+"s)":"[READY]");}}function end(m){run=false;document.exitPointerLock();alert(m);location.reload();}
